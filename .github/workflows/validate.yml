name: サンプルフロー JSON を検証

# デプロイ前ゲート（deploy.yml）だけでは main へマージした後にしか止まらない。
# PR の時点で壊れたフローを弾くため、pull_request でも同じ検証を走らせる。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: サンプルフロー JSON を検証
        run: python3 scripts/validate-flow-json.py

      # ノード図の色付きの箱が読めるか検証する（未定義のクラス、文字と背景のコントラスト不足）。
      # どちらも描画して初めて分かる誤りで、ソースを読むレビューやフローの検証では見つからない。
      - name: ノード図の色を検証
        run: python3 scripts/check-node-colors.py

      # Dashboard 2.0 のフローが ui-base を共有する決まりを守っているか検証する（CLAUDE.md）。
      # deploy.yml でも実行するが、それだけではマージした後にしか止まらないため、PR でも走らせる。
      - name: Dashboard 2.0 のフローを検証
        run: python3 scripts/check-dashboard-flows.py

      # ガイドに埋め込んだ動作の図が、scripts/comic の定義から生成したものと一致するか検証する。
      # これまで deploy.yml でしか実行しておらず、PR の時点では食い違いを止められなかった。
      - name: 動作の図を検証
        run: python3 scripts/comic/build.py --check
