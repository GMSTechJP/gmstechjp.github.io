name: GitHub Pages へビルド & デプロイ

# main への push 時に、git 履歴から updates.html と最終更新日を生成し、
# サイトを GitHub Pages にデプロイする。
# 生成物をリポジトリへコミットし返さない方式のため、ローカルとの差分(behind)が発生しない。
#
# 【事前設定（1回だけ）】GitHub の Settings → Pages → Source を「GitHub Actions」にすること。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを直列化（実行中はキャンセルしない）
concurrency:
  group: pages
  cancel-in-progress: false

# 実行環境は ubuntu-latest にせず、版を書く。ubuntu-latest は GitHub の都合で新しい版へ
# 切り替わり（2026-10-19 から 24.04 → 26.04）、公開が知らないうちに別の環境で動くため。
# 上げるときは validate.yml も同じ版にそろえる。
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: チェックアウト（全履歴）
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # 利用者がコピーボタンで受け取るフロー JSON が壊れていないか検証する。
      # 壊れていても JSON としては valid なため、パース成功だけでは検出できない。
      - name: サンプルフロー JSON を検証
        run: python3 scripts/validate-flow-json.py

      # ノード図の色付きの箱が読めるか検証する（未定義のクラス、文字と背景のコントラスト不足）。
      # どちらも描画して初めて分かる誤りで、ソースを読むレビューやフローの検証では見つからない。
      - name: ノード図の色を検証
        run: python3 scripts/check-node-colors.py

      # ノード図の共有スタイル（css/node-diagram.css）が、生成スクリプトの対応表と一致するか検証する。
      # CSS を直接直すと、次の生成で上書きされて消えるため。アイコンのファイルの有無も確かめる。
      - name: ノード図の共有スタイルを検証
        run: python3 scripts/gen-node-diagram-css.py --check

      # 表のあるページが、短い列の折り返しを防ぐスクリプト（js/table-fit.js）を読み込んでいるか検証する。
      # 読み込みを忘れても表示は崩れず、折り返しが戻るだけなので、見た目の確認では気づきにくい。
      - name: 表の列幅のスクリプトを検証
        run: python3 scripts/check-table-fit.py

      # データの並びの図（レジスタ・バイト・ビットのマス目）が共有スタイルで描かれるか検証する。
      # スタイルの読み込み忘れやクラスの打ち間違いがあると、マス目が描かれず文字が並ぶだけになる。
      - name: データの並びの図を検証
        run: python3 scripts/check-register-diagram.py

      # Dashboard 2.0 のフローが ui-base を共有する決まりを守っているか検証する（CLAUDE.md）。
      # ID が他のフローと重なると、読み込む順序によって ui-base が2つに分かれ、ページが消える。
      # 読み込む順序に依存するため、手での動作確認やレビューでは見落としやすい。
      - name: Dashboard 2.0 のフローを検証
        run: python3 scripts/check-dashboard-flows.py

      # ガイドに埋め込んだ動作の図が、scripts/comic の定義から生成したものと一致するか検証する。
      # HTML 側の図を手で直すと、次の生成で上書きされて消えるため。
      - name: 動作の図を検証
        run: python3 scripts/comic/build.py --check

      - name: 更新履歴と最終更新日を生成
        run: python3 scripts/gen_updates.py

      - name: 公開ファイルを収集（.git 等の非公開物を除外）
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='_site' \
            ./ _site/

      - name: Pages 設定
        uses: actions/configure-pages@v6

      # v4 以降は、名前が . で始まるファイル（.gitignore など）を公開物に含めない
      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v5
